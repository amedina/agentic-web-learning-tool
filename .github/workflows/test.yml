name: Tests

on:
  pull_request:
    branches:
      - main

# Cancels all prior workflow runs associated with pull requests that are still in progress.
concurrency:
  # The concurrency group contains the workflow name and the (target) branch name.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.package }})
    # Change ubuntu version as the latest ubuntu is unable to run for some reason. Change it back to latest when its fixed.
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: read # For actions/checkout to fetch code
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engine-extension (test:engine-extension) is intentionally excluded:
        # its suites are stale relative to main's source (renamed modules,
        # removed APIs) and only compile against the develop branch. They will
        # rejoin the gate when develop merges into main. A handful of likewise
        # stale engine-core suites are skipped via its jest.config.js for the
        # same reason; the remaining engine-core suites still run here.
        #
        # The following packages live only on the develop branch (under a
        # restructured layout) and do not exist on main yet, so they cannot be
        # gated here. Add them to this matrix as part of the develop -> main
        # merge, once they land on main:
        #   - vscode extension        (packages/extensions/vscode)
        #   - npm-advisor MCP server  (packages/mcp/npm-advisor-mcp)
        #   - package-analyzer-core / package-analyzer-ui / project-analyzer-core
        #   - awl-mcp-inspector       (packages/mcp/awl-mcp-inspector; today's
        #                              packages/mcp-inspector, deps need fixing)
        include:
          - package: extension
            script: test:extension
          - package: design-system
            script: test:design-system
          - package: npm-advisor
            script: test:npm-advisor
          - package: engine-core
            script: test:engine
    steps:
      - name: Harden Runner # Security agent: blocks outbound traffic & detects code overwrite to prevent breaches
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6
        with:
          disable-sudo: true
          disable-file-monitoring: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@64ed1c7eab4cce3362f8c340dee64e5eaeef8f7c
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm i
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Run tests
        run: pnpm ${{ matrix.script }}
        env:
          NODE_OPTIONS: --max-old-space-size=4096
