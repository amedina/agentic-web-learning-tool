# Throwaway local npm registry config for publish testing (Verdaccio).
#
# Used by bin/setup-local-registry.sh (`pnpm local-registry:start`). Packages
# are written to the on-disk ./storage dir (next to this config, gitignored),
# which the setup script wipes on every start, so nothing persists between
# `local-registry:start` runs.
#
# The default on-disk storage is used deliberately instead of the in-memory
# store: the verdaccio-memory plugin's removePackage is a no-op, so unpublish
# never takes effect and re-publishing the same version returns 409 for the
# life of the registry. On-disk storage honors unpublish, which lets
# `publish:npm-advisor-mcp:local` unpublish-then-publish the same version.
storage: ./storage

auth:
  htpasswd:
    file: ./htpasswd
    # Let the setup script's npm-cli-login register the admin user on first run.
    max_users: 1000

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  "@agentic-web-labs/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
  "@*/*":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs
  "**":
    access: $all
    publish: $authenticated
    unpublish: $authenticated
    proxy: npmjs

log: { type: stdout, format: pretty, level: warn }
